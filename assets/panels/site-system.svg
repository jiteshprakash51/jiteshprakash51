<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#121526"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A1A1AA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A1A1AA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridp" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1E293B" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="120" rx="13" fill="url(#bgp)"/>
  <rect width="400" height="120" rx="13" fill="url(#gridp)"/>
  <circle cx="47" cy="57" r="68" fill="url(#glow)">
    <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
  </circle>
  <rect x="1.5" y="1.5" width="397" height="117" rx="13" fill="none" stroke="#A1A1AA" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="47" cy="57" r="26" fill="#0F172A" stroke="#A1A1AA" stroke-width="2"/>
  <text x="47" y="66" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="23" font-weight="800" fill="#A1A1AA">MS</text>
  <text x="88" y="47" font-family="Inter, 'Segoe UI', sans-serif" font-size="23" font-weight="800" fill="#F1F5F9">Site System</text>
  <text x="88" y="67" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">One Next.js app, one identity</text>
  <text x="88" y="84" font-family="Inter, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">One admin for every section of my site</text>
  <rect x="88" y="91" width="69" height="20" rx="10" fill="#0F172A" stroke="#A1A1AA" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="122.5" y="105" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#A1A1AA">Next.js</text>
